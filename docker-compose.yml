services:
  db:
    image: postgres:17
    container_name: awsol_db
    environment:
      POSTGRES_USER: sneha
      POSTGRES_PASSWORD: sneha_dev_pw
      POSTGRES_DB: sneha_erp
    ports:
      - "5433:5432"
    volumes:
      - awsol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneha -d sneha_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awsol_app
    environment:
      DATABASE_URL: postgresql+psycopg2://sneha:sneha_dev_pw@db:5432/sneha_erp
      JWT_SECRET: docker-compose-dev-only-secret-not-for-prod
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      LOG_LEVEL: INFO
      GUNICORN_WORKERS: "3"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  awsol_pgdata:
